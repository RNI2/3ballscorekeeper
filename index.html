<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365d">
<title>3-Ball Scorekeeper</title>
<style>
:root{--navy:#17365d;--blue:#2f75b5;--cream:#fffdf2;--pale:#eaf2f8;--line:#c7d3df;--green:#dff3e4;--text:#17202a}
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:900px;margin:auto;min-height:100vh;background:white;padding-bottom:80px}
header{background:var(--navy);color:white;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0}.sub{font-size:12px;opacity:.85;margin-top:3px}
.toolbar{display:flex;gap:8px;padding:12px;flex-wrap:wrap}.toolbar button,.primary{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:white}.secondary{background:#e9eef3;color:#203040}.danger{background:#ffe6e6;color:#8b1e1e}
.card{margin:0 12px 12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:white}
.cardtitle{background:var(--navy);color:white;font-weight:800;padding:10px 12px}
.players{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.player{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--cream)}
.player input{width:100%;font-weight:700;border:0;border-bottom:1px solid var(--line);background:transparent;padding:5px;font-size:15px}
.total{font-size:24px;font-weight:900;margin-top:6px}.leader{background:var(--green)}
.current{padding:14px;text-align:center;font-size:18px;font-weight:800}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{border:1px solid var(--line);padding:6px;text-align:center}th{background:var(--blue);color:white;font-size:12px}
th:first-child,td:first-child{background:var(--pale);font-weight:700;width:48px}
.score{width:100%;min-width:62px;border:0;background:var(--cream);text-align:center;font-size:18px;padding:8px;border-radius:6px}
.score:focus{outline:2px solid var(--blue);background:white}
.notice{font-size:12px;text-align:center;color:#637080;padding:4px 12px 12px}
@media(max-width:600px){.players{grid-template-columns:repeat(2,1fr)}h1{font-size:20px}.toolbar button{flex:1}th{}}
</style>
</head>
<body><div class="app">
<header><h1>🎱 3-Ball Pool Scorekeeper</h1><div class="sub">Lowest total score wins • saves automatically on this device</div></header>
<div class="toolbar">
<button class="primary" id="addRound">+ Add Round</button>
<button class="secondary" id="undo">Undo Last Entry</button>
<button class="danger" id="newGame">New Game</button>
</div>
<section class="card"><div class="cardtitle">LIVE SCORE TOTALS</div><div class="players" id="players"></div><div class="current" id="leader">No scores yet</div></section>
<section class="card"><div class="cardtitle">SCORECARD</div><div class="tablewrap"><table><thead><tr id="head"><th>Round</th></tr></thead><tbody id="body"></tbody></table></div></section>
<div class="notice">Scores are stored in this browser on this device. Closing the tab or locking your phone will not reset the game.</div>
</div>
<script>
const KEY='threeBallGameV1';
const defaults=()=>({names:['Player 1','Player 2','Player 3','Player 4','Player 5','Player 6'],rounds:Array.from({length:10},()=>Array(6).fill('')),history:[]});
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){state=defaults()}
if(!state.names||!state.rounds)state=defaults();
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const totals=()=>state.names.map((_,p)=>state.rounds.reduce((s,r)=>s+(r[p]===''?0:Number(r[p])||0),0));
const active=()=>state.names.map((_,p)=>state.rounds.some(r=>r[p]!==''&&r[p]!=null));
function render(){
 const t=totals(),a=active(),vals=t.filter((_,i)=>a[i]),low=vals.length?Math.min(...vals):null;
 const ps=document.getElementById('players');ps.innerHTML='';
 state.names.forEach((n,i)=>{let d=document.createElement('div');d.className='player'+(a[i]&&t[i]===low?' leader':'');
 d.innerHTML='<input aria-label="Player name" value="'+esc(n)+'" data-name="'+i+'"><div class="total">'+(a[i]?t[i]:'—')+'</div>';ps.appendChild(d)});
 let leaders=state.names.filter((_,i)=>a[i]&&t[i]===low);
 document.getElementById('leader').textContent=low===null?'🏆 No scores yet':leaders.length>1?'🏆 TIE — '+leaders.join(' & ')+' — '+low+' shots':'🏆 Current Leader: '+leaders[0]+' — '+low+' shots';
 const h=document.getElementById('head');h.innerHTML='<th>Round</th>'+state.names.map(n=>'<th>'+esc(n)+'</th>').join('');
 const b=document.getElementById('body');b.innerHTML='';
 state.rounds.forEach((r,ri)=>{let tr=document.createElement('tr');tr.innerHTML='<td>'+(ri+1)+'</td>'+r.map((v,pi)=>'<td><input class="score" inputmode="numeric" pattern="[0-9]*" value="'+esc(v)+'" data-r="'+ri+'" data-p="'+pi+'" aria-label="Round '+(ri+1)+' '+esc(state.names[pi])+'"></td>').join('');b.appendChild(tr)});
 bind();
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bind(){
 document.querySelectorAll('[data-name]').forEach(el=>el.onchange=e=>{state.names[+e.target.dataset.name]=e.target.value.trim()||'Player '+(+e.target.dataset.name+1);save();render()});
 document.querySelectorAll('.score').forEach(el=>el.onchange=e=>{let r=+e.target.dataset.r,p=+e.target.dataset.p,old=state.rounds[r][p];let v=e.target.value.trim();if(v!==''&&(!/^\d+$/.test(v)||+v<1||+v>99)){e.target.value=old;return}state.history.push({r,p,old});if(state.history.length>50)state.history.shift();state.rounds[r][p]=v;save();render()});
}
document.getElementById('addRound').onclick=()=>{state.rounds.push(Array(6).fill(''));save();render();setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),50)};
document.getElementById('undo').onclick=()=>{let x=state.history.pop();if(!x)return;state.rounds[x.r][x.p]=x.old;save();render()};
document.getElementById('newGame').onclick=()=>{if(confirm('Start a new game? This clears all scores and player names.')){state=defaults();save();render()}};
render();
</script></body></html>
