<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17365d"><title>3-Ball Scorekeeper</title>
<style>
:root{--felt:#07533f;--felt-dark:#032f28;--felt-deep:#021f1c;--wood1:#8b451f;--wood2:#4c2412;--cream:#fff8e8;--line:rgba(210,235,226,.25);--blue:#1684dc;--green:#10a85a;--red:#b52323;--text:#f7f3e9}
*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#071c1a url('https://images.unsplash.com/photo-1742521845687-427c3f8c91d5?auto=format&fit=crop&fm=jpg&q=82&w=2200') center/cover fixed no-repeat}body:before{content:'';position:fixed;inset:0;background:linear-gradient(90deg,rgba(0,20,17,.82),rgba(0,31,25,.58),rgba(0,15,13,.82));backdrop-filter:blur(2px);z-index:-1}
.app{max-width:980px;margin:auto;min-height:100vh;padding-bottom:70px;background:linear-gradient(180deg,rgba(3,54,44,.86),rgba(2,35,30,.92));box-shadow:0 0 50px #000a}
header{position:relative;padding:calc(18px + env(safe-area-inset-top)) 20px 18px 84px;background:linear-gradient(180deg,rgba(0,13,12,.96),rgba(2,39,33,.90));border-bottom:5px solid #7d3b18;box-shadow:0 5px 18px #000b}header:before{content:'3';position:absolute;left:18px;top:calc(12px + env(safe-area-inset-top));width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,#f7edc8 0 24%,#d9cda7 25% 27%,transparent 28%),radial-gradient(circle at 32% 25%,#ff8077 0 6%,#e52620 17%,#b20d0d 58%,#61060a 84%,#2a0205 100%);border:2px solid #5b0707;box-shadow:0 6px 12px #000b,inset -7px -9px 12px #0005;color:#15100c;font:900 20px Georgia;line-height:1;z-index:2;text-indent:0;align-items:center;padding-bottom:3px}

h1{font-family:Georgia,'Times New Roman',serif;font-size:29px;letter-spacing:.2px;margin:0;text-shadow:0 2px 3px #000}.sub{font-size:12px;opacity:.86;margin-top:4px}
.card{position:relative;margin:14px;border:5px solid #6f3518;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,rgba(0,27,24,.91),rgba(1,55,44,.89));box-shadow:0 9px 20px #0009,inset 0 0 0 2px #b76a2c,inset 0 0 0 4px #3a1b0c}.card:before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 5px);mix-blend-mode:screen}
.cardtitle{position:relative;font-family:Georgia,'Times New Roman',serif;background:linear-gradient(90deg,rgba(0,18,17,.97),rgba(0,57,45,.93));color:#fff1bd;font-weight:900;padding:11px 14px;letter-spacing:.6px;border-bottom:1px solid #b7843c;text-shadow:0 2px 2px #000}
.turn{text-align:center;padding:20px 14px;background:radial-gradient(circle at 50% 40%,rgba(13,100,76,.35),transparent 50%)}.turnmeta{font-size:13px;font-weight:900;color:#d4e8e1;text-transform:uppercase;letter-spacing:.08em}.turnname{font-family:Georgia,'Times New Roman',serif;font-size:36px;font-weight:900;margin:7px 0;color:#fff9e9;text-shadow:0 2px 4px #000}.label{font-size:14px;color:#c6d8d2}
.counter{display:flex;align-items:center;justify-content:center;gap:20px;margin:18px 0}.count{font-family:Georgia,serif;font-size:62px;line-height:1;font-weight:900;min-width:80px;text-shadow:0 3px 4px #000}.counter button{width:78px;height:78px;border:1px solid #58aef2;border-radius:18px;font-size:42px;font-weight:700;background:linear-gradient(#2295eb,#0872c5);color:#fff;box-shadow:0 5px 10px #0006,inset 0 1px rgba(255,255,255,.3);touch-action:manipulation}.counter button:active{transform:translateY(2px);box-shadow:0 2px 5px #0006}
.scratchrow{display:flex;justify-content:center;margin:-3px 0 14px}.scratch{width:96px;height:96px;border-radius:50%;border:2px solid #ddd;background:radial-gradient(circle at 35% 28%,#fff,#f5f2e9 58%,#c9c4b8 82%,#8e897f);color:#151515;font-weight:900;font-size:15px;line-height:1.05;box-shadow:0 7px 13px #0008,inset -5px -7px 10px #0002;touch-action:manipulation}.scratch span{display:block;color:#b52222;font-size:24px;margin-top:4px}.scratch:active{transform:translateY(2px)}.actions{display:flex;gap:10px;justify-content:center}.actions button,.toolbar button{border-radius:11px;padding:13px 18px;font-weight:850;font-size:16px;box-shadow:0 3px 8px #0004}.done{border:1px solid #49d18a;background:linear-gradient(#18bd68,#09934d);color:#fff;min-width:170px}.done:disabled{opacity:.45}.back{border:1px solid #75949c;background:linear-gradient(#47636b,#2c454d);color:#fff}
.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}.player{border:1px solid rgba(141,200,184,.4);border-left:5px solid var(--blue);border-radius:11px;padding:10px;background:linear-gradient(145deg,rgba(5,55,48,.9),rgba(2,34,31,.9));box-shadow:0 4px 9px #0004}.player input{width:100%;font-family:Georgia,serif;font-weight:800;border:0;border-bottom:1px solid rgba(255,255,255,.2);color:#fff;background:transparent;padding:5px;font-size:17px}.total{font-size:25px;font-weight:900;margin-top:7px}.leader{border-left-color:#39d879;background:linear-gradient(145deg,rgba(11,91,63,.95),rgba(3,48,39,.95))}.current{padding:12px;text-align:center;font-weight:800;color:#fff1b7}.toolbar{display:flex;gap:10px;padding:0 14px 2px}.toolbar button{flex:1}.new{border:1px solid #f15b5b;background:linear-gradient(#c93434,#9d1717);color:white}.start{border:1px solid #e8c468;background:linear-gradient(#b88319,#80570b);color:#fff}.setupmsg{text-align:center;padding:20px 14px;color:#f5e7bd;font-weight:800}.history{padding:12px;display:grid;gap:10px}.historyitem{border:1px solid rgba(231,193,107,.38);border-radius:12px;background:rgba(0,24,22,.82);padding:12px;box-shadow:0 4px 10px #0005}.historytop{display:flex;justify-content:space-between;gap:10px;align-items:center;font-family:Georgia,serif;color:#ffe6a3;font-weight:900}.historymeta{font-size:11px;color:#a9cbc0;margin-top:3px}.historyscores{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.historyscore{background:#fff8e8;color:#16201e;border-radius:8px;padding:7px 9px;font-size:12px}.historyscore.winner{background:#f5d66f;font-weight:900}.emptyhistory{text-align:center;color:#a9cbc0;padding:18px}.add{border:1px solid #3eaff5;background:linear-gradient(#075d86,#033f60);color:white}.remove{border:1px solid #e85858;background:#7e1e1e;color:#fff;border-radius:8px;padding:6px 8px;font-size:12px;font-weight:800;margin-top:7px}.inactive{opacity:.5}.status{font-size:11px;color:#a9cbc0;margin-top:4px}.scratchnote{min-height:14px;line-height:14px}
.tablewrap{overflow-x:auto;padding:0 10px 10px}table{border-collapse:separate;border-spacing:0;width:100%;min-width:620px;border:1px solid rgba(255,255,255,.2);border-radius:9px;overflow:hidden}th,td{border-right:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.12);padding:7px;text-align:center}th{background:linear-gradient(#183c43,#102c32);color:white;font-size:12px}th:first-child,td:first-child{background:#102f34;font-weight:800;width:48px;color:#fff}.edit{width:100%;min-width:58px;border:1px solid rgba(120,92,52,.25);background:#fff8e8;color:#16201e;text-align:center;font-size:16px;padding:7px;border-radius:5px}.note{text-align:center;color:#bad0ca;font-size:12px;padding:0 12px 14px}
@media(max-width:600px){body{background-attachment:scroll}header{padding-left:72px}header:before{left:12px;width:48px;height:48px}h1{font-size:22px}.players{grid-template-columns:repeat(2,1fr)}.turnname{font-size:32px}.counter button{width:82px;height:82px}.card{margin:10px}.toolbar{padding:0 10px 2px}.toolbar button{padding:12px 8px}.turn{padding:17px 10px}}
</style></head><body><div class="app">
<header><h1>3-Ball Pool Scorekeeper</h1><div class="sub">Lowest total score wins • automatically saved</div></header>
<section class="card"><div class="cardtitle">CURRENT TURN</div><div class="turn"><div class="turnmeta" id="turnMeta"></div><div class="turnname" id="turnName"></div><div class="label">Shots this turn</div><div class="counter"><button id="minus" aria-label="Subtract shot">−</button><div class="count" id="count">0</div><button id="plus" aria-label="Add shot">+</button></div><div class="scratchrow"><button class="scratch" id="scratch">Scratch<span>+1</span></button></div><div class="actions"><button class="back" id="back">← Back</button><button class="done" id="done">✓ Done</button></div></div></section>
<section class="card"><div class="cardtitle">LIVE SCORE TOTALS</div><div class="current" id="leader"></div><div class="players" id="players"></div></section>
<div class="toolbar"><button class="add" id="addPlayer">+ Add Player</button><button class="back" id="abandonGame" style="display:none">↩ Abandon Game</button><button class="start" id="gameAction">🎱 Start Game</button></div>
<section class="card"><div class="cardtitle">SCORECARD</div><div class="tablewrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></section>
<div class="note">Every tap saves on this device. Use the scorecard below to correct a completed score.</div><section class="card"><div class="cardtitle">GAME HISTORY</div><div class="history" id="history"></div></section>
</div><script>
const KEY='threeBallGameV4',HISTORY_KEY='threeBallHistoryV1',MAX=6;
const fresh=()=>({players:[{name:'Player 1',active:true},{name:'Player 2',active:true}],rounds:[Array(2).fill('')],scratches:[Array(2).fill(0)],round:0,player:0,draft:0,draftScratches:0,started:false});
let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){s=fresh()}
if(!s.players||!s.rounds)s=fresh();s.scratches??=s.rounds.map(r=>Array(r.length).fill(0));s.round??=0;s.player??=0;s.draft??=0;s.draftScratches??=0;s.started??=false;let history;try{history=JSON.parse(localStorage.getItem(HISTORY_KEY))||[]}catch(e){history=[]}const saveHistory=()=>localStorage.setItem(HISTORY_KEY,JSON.stringify(history));
const save=()=>localStorage.setItem(KEY,JSON.stringify(s)),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const activeIdx=()=>s.players.map((p,i)=>p.active?i:-1).filter(i=>i>=0);
const totals=()=>s.players.map((_,i)=>s.rounds.reduce((a,r)=>a+(r[i]===''||r[i]==null?0:Number(r[i])||0),0));
const hasScore=i=>s.rounds.some(r=>r[i]!==''&&r[i]!=null);
function normalizeTurn(){let a=activeIdx();if(!a.length)return;if(!s.players[s.player]||!s.players[s.player].active)s.player=a[0]}
function render(){
 normalizeTurn();let a=activeIdx(),pos=a.indexOf(s.player),playing=!!s.started;
 document.getElementById('turnMeta').textContent='Round '+(s.round+1)+' • Player '+(pos+1)+' of '+a.length;
 document.getElementById('turnName').textContent=s.players[s.player].name;document.getElementById('count').textContent=s.draft;document.getElementById('done').disabled=!playing||s.draft<1;document.getElementById('minus').disabled=!playing||s.draft<1;document.getElementById('plus').disabled=!playing;document.getElementById('scratch').disabled=!playing;document.getElementById('back').disabled=!playing;
 const t=totals(),eligible=a.filter(i=>hasScore(i)),low=eligible.length?Math.min(...eligible.map(i=>t[i])):null;
 let p=document.getElementById('players');p.innerHTML='';
 s.players.forEach((pl,i)=>{let d=document.createElement('div');d.className='player'+(!pl.active?' inactive':'')+(pl.active&&hasScore(i)&&t[i]===low?' leader':'');
 let sc=s.scratches.reduce((n,r)=>n+(Number(r[i])||0),0),canRemove=!playing&&pl.active&&a.length>2;let defaultName='Player '+(i+1),isDefault=/^Player \\d+$/.test(pl.name),shownName=isDefault?'':pl.name;d.innerHTML='<input value="'+esc(shownName)+'" placeholder="'+esc(defaultName)+'" data-name="'+i+'" onpointerdown="if(/^Player \\d+$/.test(this.value)){this.value=\'\'}" onfocus="if(/^Player \\d+$/.test(this.value)){this.value=\'\'}"><div class="total">'+(hasScore(i)?t[i]:'—')+'</div><div class="status">'+(pl.active?'Active':'No longer playing')+' • Scratches: '+sc+'</div>'+(canRemove?'<button class="remove" data-remove="'+i+'">Remove</button>':'');p.appendChild(d)});
 let leaders=eligible.filter(i=>t[i]===low).map(i=>s.players[i].name);document.getElementById('leader').textContent=low===null?'🏆 No completed scores yet':leaders.length>1?'🏆 TIE — '+leaders.join(' & ')+' — '+low+' shots':'🏆 Current Leader: '+leaders[0]+' — '+low+' shots';
 document.getElementById('head').innerHTML='<th>Round</th>'+s.players.map(p=>'<th>'+esc(p.name)+(p.active?'':' †')+'</th>').join('');
 let b=document.getElementById('body');b.innerHTML='';s.rounds.forEach((r,ri)=>{let tr=document.createElement('tr');tr.innerHTML='<td>'+(ri+1)+'</td>'+s.players.map((_,pi)=>'<td><input class="edit" inputmode="numeric" value="'+esc(r[pi]??'')+'" data-r="'+ri+'" data-p="'+pi+'"><div class="status scratchnote">'+((s.scratches[ri]&&s.scratches[ri][pi])?'Scratch × '+s.scratches[ri][pi]:'&nbsp;')+'</div></td>').join('');b.appendChild(tr)});
 document.getElementById('addPlayer').disabled=playing||s.players.length>=MAX;
 document.querySelectorAll('[data-name]').forEach(x=>x.disabled=false);
 let ga=document.getElementById('gameAction');ga.textContent=playing?'🏁 Finish Game':'🎱 Start Game';ga.className=playing?'new':'start';document.getElementById('abandonGame').style.display=playing?'inline-block':'none';
 renderHistory();bind();
}
function renderHistory(){let el=document.getElementById('history');if(!history.length){el.innerHTML='<div class="emptyhistory">No finished games yet. Your pool-table mythology begins here.</div>';return}el.innerHTML=history.slice().reverse().map((g,rev)=>{let low=Math.min(...g.players.map(p=>p.total)),winners=g.players.filter(p=>p.total===low).map(p=>p.name),num=history.length-rev;return '<div class="historyitem"><div class="historytop"><span>Game #'+num+'</span><span>🏆 '+esc(winners.join(' & '))+'</span></div><div class="historymeta">'+esc(g.stamp)+' • '+g.players.length+' players • '+g.roundCount+' rounds</div><div class="historyscores">'+g.players.map(p=>'<span class="historyscore '+(p.total===low?'winner':'')+'">'+esc(p.name)+' — '+p.total+' <small>('+p.scratches+' scratch'+(p.scratches===1?'':'es')+')</small></span>').join('')+'</div></div>'}).join('')}
function completedRoundCount(){return s.rounds.filter(r=>activeIdx().every(i=>r[i]!==''&&r[i]!=null)).length}
function archiveGame(){let a=activeIdx(),t=totals(),rc=completedRoundCount();history.push({stamp:new Date().toLocaleString([], {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}),roundCount:rc,players:a.map(i=>({name:s.players[i].name,total:t[i],scratches:s.scratches.reduce((n,r)=>n+(Number(r[i])||0),0)})),rounds:s.rounds.map(r=>r.slice()),scratches:s.scratches.map(r=>r.slice())});saveHistory()}
function bind(){
 document.querySelectorAll('[data-name]').forEach(x=>x.onchange=e=>{let i=+e.target.dataset.name;s.players[i].name=e.target.value.trim()||'Player '+(i+1);save();render()});
 document.querySelectorAll('.edit').forEach(x=>{x.disabled=!s.started;x.onchange=e=>{let r=+e.target.dataset.r,p=+e.target.dataset.p,v=e.target.value.trim();if(v!==''&&(!/^\\d+$/.test(v)||+v<1||+v>99)){render();return}s.rounds[r][p]=v;save();render()}});
 document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=e=>removePlayer(+e.target.dataset.remove));
}
function removePlayer(i){if(activeIdx().length<=2)return;if(!confirm('Remove '+s.players[i].name+' from future turns? Their existing scores will stay in the scorecard.'))return;s.players[i].active=false;if(i===s.player){s.draft=0;let a=activeIdx(),next=a.find(x=>x>i);s.player=next??a[0];if(!next&&a[0]<i){s.round++;if(!s.rounds[s.round]){s.rounds.push(Array(s.players.length).fill(''));s.scratches.push(Array(s.players.length).fill(0))}}}save();render()}
document.getElementById('plus').onclick=()=>{if(s.draft<99)s.draft++;save();render()};
document.getElementById('minus').onclick=()=>{if(s.draft>0){s.draft--;if(s.draftScratches>s.draft)s.draftScratches=s.draft;}save();render()};document.getElementById('scratch').onclick=()=>{if(s.draft<99){s.draft++;s.draftScratches++;save();render()}};
document.getElementById('done').onclick=()=>{if(s.draft<1)return;s.rounds[s.round][s.player]=String(s.draft);s.scratches[s.round][s.player]=s.draftScratches;s.draft=0;s.draftScratches=0;let a=activeIdx(),pos=a.indexOf(s.player);if(pos<a.length-1)s.player=a[pos+1];else{s.player=a[0];s.round++;if(!s.rounds[s.round]){s.rounds.push(Array(s.players.length).fill(''));s.scratches.push(Array(s.players.length).fill(0))}}save();render();window.scrollTo({top:0,behavior:'smooth'})};
document.getElementById('back').onclick=()=>{if(s.draft>0&&!confirm('Discard the current shot count and go back?'))return;s.draft=0;let a=activeIdx(),pos=a.indexOf(s.player);if(pos>0)s.player=a[pos-1];else if(s.round>0){s.round--;s.player=a[a.length-1]}let old=s.rounds[s.round][s.player];if(old!==''){s.draft=Number(old);s.draftScratches=Number(s.scratches[s.round][s.player])||0;s.rounds[s.round][s.player]='';s.scratches[s.round][s.player]=0}save();render()};
document.getElementById('addPlayer').onclick=()=>{if(s.players.length>=MAX)return;let n=s.players.length+1;s.players.push({name:'Player '+n,active:true});s.rounds.forEach(r=>r.push(''));s.scratches.forEach(r=>r.push(0));save();render()};
document.getElementById('abandonGame').onclick=()=>{if(!s.started)return;if(!confirm('Abandon this game? It will not be saved to Game History.'))return;s=fresh();save();render();window.scrollTo({top:0,behavior:'smooth'})};
document.getElementById('gameAction').onclick=()=>{if(!s.started){if(activeIdx().length<2)return;s.started=true;s.round=0;s.player=activeIdx()[0];s.draft=0;s.draftScratches=0;save();render();return}let rc=completedRoundCount();if(rc<1){if(!confirm('Exit this game? No completed rounds means this game will not be saved to Game History.'))return;s=fresh();save();render();window.scrollTo({top:0,behavior:'smooth'});return}if(!confirm('Finish this game? Final scores will be saved to Game History.'))return;archiveGame();s=fresh();save();render();window.scrollTo({top:0,behavior:'smooth'})};
render();
</script></body></html>
